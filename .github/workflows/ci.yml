name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  arch-package:
    name: Arch PKGBUILD
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      # git must exist before checkout, or it falls back to a tarball without history.
      - run: pacman -Syu --noconfirm --needed base-devel git rust
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build package with makepkg
        run: |
          useradd -m builder
          cp -r packaging/aur/utatui-git /home/builder/pkg
          # Build the commit under test instead of upstream main.
          sed -i "s|git+https://github.com/NunoiEnter/Utatui.git|git+file://$GITHUB_WORKSPACE|" /home/builder/pkg/PKGBUILD
          chown -R builder /home/builder
          # The checkout belongs to another user; let makepkg's git clone it.
          su builder -c "git config --global --add safe.directory '*'"
          su builder -c 'cd ~/pkg && makepkg --noconfirm && makepkg --printsrcinfo > .SRCINFO'
          pacman -U --noconfirm /home/builder/pkg/*.pkg.tar.zst
          utatui --version
